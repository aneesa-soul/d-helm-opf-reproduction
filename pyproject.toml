[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhelm-opf-reproduction"
version = "0.1.0"
description = "Independent reproduction of the D-HELM optimal power flow method"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # pandapower < 3 breaks its OPF with scipy >= 1.14 (csc_matrix.H was
    # removed), so every runopp fails.  Results were produced with 3.5.6.
    "pandapower>=3.0",
    "torch>=2.0",
    "matplotlib",
]

[project.optional-dependencies]
# Baseline agents (paper Sec. 4.1: Tianshou + gymnasium).  0.5.1 is the
# last Tianshou release for Python 3.10 (1.x needs >= 3.11).
baselines = [
    "tianshou==0.5.1",
    "gymnasium>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]
