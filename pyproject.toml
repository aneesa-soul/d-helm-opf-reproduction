[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhelm-opf-reproduction"
version = "0.1.0"
description = "Independent reproduction of the D-HELM optimal power flow method"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
