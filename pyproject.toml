[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhelm-opf-reproduction"
version = "0.1.0"
description = "Independent reproduction of the D-HELM optimal power flow method"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # pandapower < 3 breaks its OPF with scipy >= 1.14 (csc_matrix.H was
    # removed), so every runopp fails.  Results were produced with 3.5.6.
    "pandapower>=3.0",
    "torch>=2.0",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
